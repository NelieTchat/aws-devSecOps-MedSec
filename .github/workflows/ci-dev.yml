name: ci-dev
on:
  push:
    branches: ["dev"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-west-2
      ECR_REPO_NAME: medsec-portal-dev

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute short SHA
        id: vars
        shell: bash
        run: echo "short_sha=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        shell: bash
        run: docker build --no-cache -t ${{ env.ECR_REPO_NAME }}:dev-${{ steps.vars.outputs.short_sha }} ./app

      # ---- Trivy via CLI (avoids action input mixing) ----
      - name: Install Trivy CLI
        uses: aquasecurity/setup-trivy@v0.2.1

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      # Optional: Filesystem JSON report (non-blocking)
      - name: Trivy scan (filesystem via CLI, JSON report)
        shell: bash
        run: |
          set -euo pipefail
          IGNORE_ARG=()
          if [ -f ./app/.trivyignore ]; then
            IGNORE_ARG=(--ignorefile ./app/.trivyignore)
          fi
          trivy fs \
            --scanners vuln \
            --vuln-type os,library \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output trivy-fs.json \
            "${IGNORE_ARG[@]}" \
            ./app

      - name: Upload Trivy JSON (fs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-json
          path: trivy-fs.json
          retention-days: 7

      # Blocking image scan (HIGH/CRITICAL gate)
      - name: Trivy scan (image via CLI)
        shell: bash
        env:
          IMAGE_REF: ${{ env.ECR_REPO_NAME }}:dev-${{ steps.vars.outputs.short_sha }}
        run: |
          set -euo pipefail
          IGNORE_ARG=()
          if [ -f ./app/.trivyignore ]; then
            echo "Using ignorefile ./app/.trivyignore"
            IGNORE_ARG=(--ignorefile ./app/.trivyignore)
          fi
          echo "Scanning image: ${IMAGE_REF}"
          trivy image \
            --scanners vuln \
            --vuln-type os,library \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            "${IGNORE_ARG[@]}" \
            "${IMAGE_REF}"

      # Image JSON report (always upload)
      - name: Trivy scan (image via CLI, JSON report)
        if: always()
        shell: bash
        env:
          IMAGE_REF: ${{ env.ECR_REPO_NAME }}:dev-${{ steps.vars.outputs.short_sha }}
        run: |
          set +e
          IGNORE_ARG=()
          if [ -f ./app/.trivyignore ]; then
            IGNORE_ARG=(--ignorefile ./app/.trivyignore)
          fi
          trivy image \
            --scanners vuln \
            --vuln-type os,library \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output trivy-image.json \
            "${IGNORE_ARG[@]}" \
            "${IMAGE_REF}" || true

      - name: Upload Trivy JSON (image)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-json
          path: trivy-image.json
          retention-days: 7

      # Push only if the blocking image scan passed
      - name: Tag & Push to ECR
        if: ${{ success() }}
        shell: bash
        env:
          SHORT_SHA: ${{ steps.vars.outputs.short_sha }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          REPO_URI="${REGISTRY}/${ECR_REPO_NAME}"
          LOCAL_IMAGE="${ECR_REPO_NAME}:dev-${SHORT_SHA}"
          REMOTE_IMAGE="${REPO_URI}:dev-${SHORT_SHA}"
          docker tag "${LOCAL_IMAGE}" "${REMOTE_IMAGE}"
          docker push "${REMOTE_IMAGE}"
