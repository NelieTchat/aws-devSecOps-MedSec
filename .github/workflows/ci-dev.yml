name: ci-dev
on:
  push:
    branches: ["dev"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-west-2
      # ECR repository **name** only (no account/registry prefix)
      ECR_REPO_NAME: medsec-portal-dev

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute short SHA
        id: vars
        shell: bash
        run: echo "short_sha=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # Optional: Trivy cache to speed up scans
      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-${{ runner.os }}-${{ env.AWS_REGION }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            trivy-${{ runner.os }}-${{ env.AWS_REGION }}-${{ github.ref_name }}-
            trivy-${{ runner.os }}-

      - name: Build Docker image
        shell: bash
        run: |
          docker build -t ${{ env.ECR_REPO_NAME }}:dev-${{ steps.vars.outputs.short_sha }} ./app

      - name: Trivy scan (filesystem)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          path: ./app
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy scan (image)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          # NOTE: use workflow expressions here (not $VAR)
          image-ref: ${{ env.ECR_REPO_NAME }}:dev-${{ steps.vars.outputs.short_sha }}
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          # For faster scans (no secret scanning), you could add:
          # scanners: 'vuln'

      - name: Tag & Push to ECR
        shell: bash
        env:
          SHORT_SHA: ${{ steps.vars.outputs.short_sha }}
          REGISTRY: ${{ steps.ecr.outputs.registry }} # e.g. 123456789012.dkr.ecr.us-west-2.amazonaws.com
        run: |
          set -euo pipefail

          REPO_URI="${REGISTRY}/${ECR_REPO_NAME}"
          LOCAL_IMAGE="${ECR_REPO_NAME}:dev-${SHORT_SHA}"
          REMOTE_IMAGE="${REPO_URI}:dev-${SHORT_SHA}"

          echo "Tagging ${LOCAL_IMAGE} -> ${REMOTE_IMAGE}"
          docker tag "${LOCAL_IMAGE}" "${REMOTE_IMAGE}"

          echo "Pushing ${REMOTE_IMAGE}"
          docker push "${REMOTE_IMAGE}"

          # (Optional) also push a mutable tag for your dev env
          # docker tag "${LOCAL_IMAGE}" "${REPO_URI}:dev-latest"
          # docker push "${REPO_URI}:dev-latest"
