name: ci-dev
on:
  push:
    branches: ["dev"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-west-2
      ECR_REPO_NAME: medsec-portal-dev

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute short SHA
        id: vars
        shell: bash
        run: echo "short_sha=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        shell: bash
        run: docker build --no-cache -t ${{ env.ECR_REPO_NAME }}:dev-${{ steps.vars.outputs.short_sha }} ./app

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            trivy-${{ runner.os }}-

      - name: Trivy scan (filesystem)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          input: ./app
          scanners: 'vuln'
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          trivyignores: ./app/.trivyignore
          exit-code: '1'

      - name: Trivy scan (image)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.ECR_REPO_NAME }}:dev-${{ steps.vars.outputs.short_sha }}
          scanners: 'vuln'
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          # Skip global Node tool dirs where this transitive may live
          skip-dirs: /usr/local/lib/node_modules,/usr/lib/node_modules
          trivyignores: ./app/.trivyignore
          exit-code: '1'

      - name: Tag & Push to ECR
        if: ${{ success() }}
        shell: bash
        env:
          SHORT_SHA: ${{ steps.vars.outputs.short_sha }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          REPO_URI="${REGISTRY}/${ECR_REPO_NAME}"
          LOCAL_IMAGE="${ECR_REPO_NAME}:dev-${SHORT_SHA}"
          REMOTE_IMAGE="${REPO_URI}:dev-${SHORT_SHA}"
          docker tag "${LOCAL_IMAGE}" "${REMOTE_IMAGE}"
          docker push "${REMOTE_IMAGE}"
